<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Modelli Meteo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ======================= MAPPE ======================= -->
  <section id="tab-mappe" class="tab active">
    <header class="top">
      <div class="brand"><span class="logo"></span><div><h1>Modelli Meteo</h1><p id="runInfo" class="muted">Caricamento…</p></div></div>
      <button id="btnCompare" class="pill-btn" aria-pressed="false">Confronta</button>
    </header>

    <div class="seg" id="modelSeg"></div>
    <div class="chips" id="mapChips"></div>

    <div class="row-between">
      <div class="seg small" id="areaSeg"></div>
      <span class="hint muted">Pizzica per ingrandire</span>
    </div>

    <div id="viewer" class="viewer">
      <div class="viewer-inner" id="viewerInner"></div>
      <div id="viewerMsg" class="viewer-msg hidden"></div>
    </div>

    <div class="timeline card">
      <div class="row-between">
        <div>
          <div id="validLabel" class="valid">—</div>
          <div id="stepLabel" class="muted small-txt">—</div>
        </div>
        <div class="ctrl">
          <button class="icon-btn" id="btnPrev" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="icon-btn primary" id="btnPlay" aria-label="Animazione"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="icon-btn" id="btnNext" aria-label="Avanti"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <input type="range" id="slider" min="0" max="0" value="0">
      <div class="ticks" id="ticks"></div>
    </div>
  </section>

  <!-- ======================= LOCALITÀ ======================= -->
  <section id="tab-local" class="tab">
    <header class="top">
      <div class="brand"><span class="logo"></span><div><h1>Località</h1><p class="muted">Confronto tra modelli</p></div></div>
      <button id="btnGps" class="pill-btn">📍 Posizione</button>
    </header>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Cerca una città…" autocomplete="off">
      <div id="searchResults" class="results hidden"></div>
    </div>
    <div id="favs" class="chips"></div>
    <div id="localBody"></div>
  </section>

  <!-- ======================= INFO ======================= -->
  <section id="tab-info" class="tab">
    <header class="top">
      <div class="brand"><span class="logo"></span><div><h1>Info</h1><p class="muted">Dati e aggiornamenti</p></div></div>
      <button id="btnReload" class="pill-btn">Aggiorna</button>
    </header>
    <div id="infoBody"></div>
  </section>

  <nav class="bottom">
    <button data-tab="mappe" class="active"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span>Mappe</span></button>
    <button data-tab="local"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Località</span></button>
    <button data-tab="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>Info</span></button>
  </nav>
</div>
<script src="config.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
