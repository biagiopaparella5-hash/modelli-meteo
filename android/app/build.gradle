plugins {
    id 'com.android.application'
}

android {
    namespace 'it.grifoshop.modellimeteo'
    compileSdk 34

    defaultConfig {
        applicationId 'it.grifoshop.modellimeteo'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Chiave fissa (se presente) così gli aggiornamenti si installano sopra senza disinstallare
    signingConfigs {
        debug {
            if (file('debug.keystore').exists()) {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
