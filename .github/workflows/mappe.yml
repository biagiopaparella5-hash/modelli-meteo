name: Mappe meteo

on:
  schedule:
    # orari UTC: subito dopo l'uscita delle corse 00z/06z/12z/18z
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - "android/app/src/main/assets/www/**"
      - ".github/workflows/mappe.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mappe-v2
  cancel-in-progress: true

jobs:
  mappe:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Librerie di sistema (GRIB)
        run: sudo apt-get update -q && sudo apt-get install -y -q libeccodes-dev

      - name: Librerie Python
        run: pip install -r pipeline/requirements.txt

      - name: Cache coste e confini (cartopy)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v2

      - name: Scarica i modelli e disegna le mappe
        working-directory: pipeline
        run: python render.py --out ../site

      - name: Versione web dell'app
        run: |
          mkdir -p site/app
          cp -r android/app/src/main/assets/www/* site/app/
          echo '<meta http-equiv="refresh" content="0; url=app/">' > site/index.html

      - name: Anteprima per il controllo (branch "anteprima")
        continue-on-error: true
        run: |
          mkdir -p /tmp/prev && cp site/manifest.json /tmp/prev/
          for p in gfs/nh/z500/024 gfs/eu/z500/024 gfs/am/t850/024 ecmwf/nh/t850/024 icon/it/t2m/024 icon/eu/pcp/024 ecmwf/it/z500/240; do
            f="site/maps/$p.png"; [ -f "$f" ] && cp "$f" "/tmp/prev/$(echo $p | tr / _).png"
          done
          cd /tmp/prev && git init -q -b anteprima && git add -A
          git -c user.name=modelli-meteo-bot -c user.email=bot@users.noreply.github.com commit -qm "anteprima mappe"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" anteprima

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
