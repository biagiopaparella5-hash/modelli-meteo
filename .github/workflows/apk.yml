name: Compila APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rinomina
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ModelliMeteo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ModelliMeteo-apk
          path: ModelliMeteo.apk
